<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Check In</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5F3;
    --panel: #FFFFFF;
    --ink: #111111;
    --ink-soft: #5A5A5A;
    --red: #D7263D;
    --red-dark: #A81C2F;
    --red-shadow: #7A1220;
    --red-bg: #FBE9E8;
    --green: #1E7A46;
    --green-bg: #E8F5EC;
    --gray: #7A7A7A;
    --gray-bg: #EFEFED;
    --line: #DEDEDC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Atkinson Hyperlegible', sans-serif;
    min-height: 100vh;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    background: #111111;
    border-bottom: 3px solid var(--red);
  }
  .brand {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #F5F5F5;
  }
  .settings-btn {
    background: transparent;
    border: 2px solid var(--red);
    border-radius: 14px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    color: #F0847F;
    white-space: nowrap;
  }
  .settings-btn .gear-icon { font-size: 18px; }
  .settings-btn:focus-visible, button:focus-visible, .contact-row button:focus-visible {
    outline: 3px solid var(--red);
    outline-offset: 2px;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 24px 40px;
  }
  .screen { width: 100%; display: none; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  .status-line {
    text-align: center;
    color: var(--ink-soft);
    font-size: 18px;
    margin: 6px 0 28px;
    min-height: 26px;
  }

  .no-contacts-banner {
    display: none;
    width: 100%;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 16px;
    text-align: center;
  }
  .no-contacts-banner.show { display: block; }
  .no-contacts-banner .banner-text {
    color: var(--ink);
    font-weight: 700;
    margin-bottom: 12px;
    font-size: 16px;
  }
  .banner-btn {
    background: var(--red);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  /* Checked-in-today banner */
  .status-banner {
    display: none;
    width: 100%;
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .status-banner.show { display: block; }
  .status-banner.good { background: var(--green-bg); color: var(--green); }
  .status-banner.limit { background: var(--gray-bg); color: var(--ink-soft); }

  .button-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 20px 0 32px;
  }
  .big-button {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #ef4e5f, var(--red) 55%, var(--red-dark) 100%);
    box-shadow:
      0 14px 0 var(--red-shadow),
      0 18px 24px rgba(0,0,0,0.25),
      inset 0 -6px 12px rgba(0,0,0,0.15);
    color: white;
    font-size: 32px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    letter-spacing: 0.5px;
  }
  .big-button:active, .big-button.pressed {
    transform: translateY(10px);
    box-shadow:
      0 4px 0 var(--red-shadow),
      0 6px 10px rgba(0,0,0,0.2),
      inset 0 -6px 12px rgba(0,0,0,0.2);
  }
  .big-button:disabled { cursor: default; }

    position: absolute;
    inset: -14px;
    border-radius: 50%;
