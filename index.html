<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Check In</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5F3;
    --panel: #FFFFFF;
    --ink: #111111;
    --ink-soft: #5A5A5A;
    --red: #D7263D;
    --red-dark: #A81C2F;
    --red-shadow: #7A1220;
    --red-bg: #FBE9E8;
    --green: #1E7A46;
    --green-bg: #E8F5EC;
    --gray: #7A7A7A;
    --gray-bg: #EFEFED;
    --line: #DEDEDC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Atkinson Hyperlegible', sans-serif;
    min-height: 100vh;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    background: #111111;
    border-bottom: 3px solid var(--red);
  }
  .brand {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #F5F5F5;
  }
  .settings-btn {
    background: transparent;
    border: 2px solid var(--red);
    border-radius: 14px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    color: #F0847F;
    white-space: nowrap;
  }
  .settings-btn .gear-icon { font-size: 18px; }
  .settings-btn:focus-visible, button:focus-visible, .contact-row button:focus-visible {
    outline: 3px solid var(--red);
    outline-offset: 2px;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 24px 40px;
  }
  .screen { width: 100%; display: none; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  .status-line {
    text-align: center;
    color: var(--ink-soft);
    font-size: 18px;
    margin: 6px 0 28px;
    min-height: 26px;
  }

  .last-checkin {
    text-align: center;
    color: var(--gray);
    font-size: 13px;
    margin: -20px 0 20px;
  }

  .no-contacts-banner {
    display: none;
    width: 100%;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 16px;
    text-align: center;
  }
  .no-contacts-banner.show { display: block; }
  .no-contacts-banner .banner-text {
    color: var(--ink);
    font-weight: 700;
    margin-bottom: 12px;
    font-size: 16px;
  }
  .banner-btn {
    background: var(--red);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  /* Checked-in-today banner */
  .status-banner {
    display: none;
    width: 100%;
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .status-banner.show { display: block; }
  .status-banner.good { background: var(--green-bg); color: var(--green); }
  .status-banner.limit { background: var(--gray-bg); color: var(--ink-soft); }

  .button-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 20px 0 32px;
  }
  .big-button {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 30%, #ef4e5f, var(--red) 55%, var(--red-dark) 100%);
    box-shadow:
      0 14px 0 var(--red-shadow),
      0 18px 24px rgba(0,0,0,0.25),
      inset 0 -6px 12px rgba(0,0,0,0.15);
    color: white;
    font-size: 32px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    letter-spacing: 0.5px;
  }
  .big-button:active, .big-button.pressed {
    transform: translateY(10px);
    box-shadow:
      0 4px 0 var(--red-shadow),
      0 6px 10px rgba(0,0,0,0.2),
      inset 0 -6px 12px rgba(0,0,0,0.2);
  }
  .big-button:disabled { cursor: default; }

  .ripple {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 4px solid var(--red);
    opacity: 0;
    pointer-events: none;
  }
  .ripple.animate {
    animation: ripple-out 0.9s ease-out;
  }
  @keyframes ripple-out {
    0% { opacity: 0.6; transform: scale(0.9); }
    100% { opacity: 0; transform: scale(1.25); }
  }

  .confirm-card {
    width: 100%;
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 18px;
    padding: 20px 22px;
    text-align: center;
    display: none;
  }
  .confirm-card.show { display: block; }
  .confirm-card .headline { font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .confirm-card .sub { color: var(--ink-soft); font-size: 16px; }

  .instructions {
    text-align: center;
    color: var(--ink-soft);
    font-size: 17px;
    max-width: 320px;
    line-height: 1.5;
  }

  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 12px 24px 4px;
    opacity: 0.85;
  }
  footer a { color: var(--ink-soft); }

  .info-card {
    width: 100%;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    margin-top: 24px;
    text-align: center;
  }
  .info-card .info-label { font-size: 14px; color: var(--ink-soft); margin-bottom: 2px; }
  .info-card .info-value { font-size: 17px; font-weight: 700; }

  .share-section {
    width: 100%;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .share-title { font-size: 15px; font-weight: 700; color: var(--ink-soft); margin-bottom: 10px; text-align: center; }
  .share-buttons { display: flex; gap: 10px; }
  .share-btn {
    flex: 1;
    text-align: center;
    background: var(--panel);
    border: 2px solid var(--line);
    color: var(--ink);
    border-radius: 12px;
    padding: 12px 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    display: block;
  }
  .home-screen-steps {
    display: none;
    font-size: 14px;
    color: var(--ink-soft);
    background: var(--bg);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 10px;
    line-height: 1.5;
  }
  .home-screen-steps.show { display: block; }

  /* Contacts screen */
  .screen-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; align-self: flex-start; }
  .screen-sub { color: var(--ink-soft); font-size: 16px; margin-bottom: 20px; align-self: flex-start; }

  .owner-name-card {
    width: 100%;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .owner-name-card label { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; }
  .owner-name-card input {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 2px solid var(--line);
    border-radius: 10px;
    font-family: inherit;
  }
  .owner-name-hint { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }

  .contact-list { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .contact-row {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .contact-info .name { font-weight: 700; font-size: 17px; }
  .contact-info .phone { color: var(--ink-soft); font-size: 15px; }
  .contact-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
