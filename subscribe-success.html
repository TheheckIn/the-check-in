<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 400px;
    }
    h1 {
      color: #e63946;
      font-size: 28px;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.5;
      color: #ccc;
    }
    a {
      display: inline-block;
      margin-top: 24px;
      background: #e63946;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're all set!</h1>
    <p>Your subscription to The Check In is active. Just one more step — let's get your phone number so we know where to send your check-ins.</p>
    <a href="/?justSubscribed=1">Continue</a>
  </div>
  <script>
    // Belt-and-suspenders flag, set the moment payment succeeds — not just
    // a URL param. If someone closes this tab before the redirect below
    // fires (or before tapping Continue) and comes back to the app later
    // directly, index.html still needs to know they already paid, or its
    // Subscribe button will show as clickable again and risk sending an
    // already-paying customer through Stripe Checkout a second time.
    try { localStorage.setItem('checkinJustSubscribed', '1'); } catch (e) {}

    // Auto-advance after a moment so most people don't have to tap at all.
    setTimeout(function () {
      window.location.href = '/?justSubscribed=1';
    }, 2500);
  </script>
</body>
</html>
